<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderQuery - AI Flight Discovery</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>WanderQuery ✈️</h1>
        <p class="subtitle">Describe your ideal destination. We'll find the flights.</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="e.g., A tech hub in the US or a sunny beach in Europe...">
            <button id="searchButton">Search</button>
        </div>

        <div id="loader" class="loader" style="display: none;"></div>

        <div id="results" class="results-container">
            </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('results');
        const loader = document.getElementById('loader');

        async function performSearch() {
            const query = searchInput.value;
            if (!query) {
                resultsContainer.innerHTML = '<p class="error">Please enter a search query.</p>';
                return;
            }

            resultsContainer.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                loader.style.display = 'none';

                if (!response.ok) {
                    throw new Error('Network response was not ok.');
                }

                const data = await response.json();

                if (data.length > 0) {
                    let html = '<h2>Recommended Destinations:</h2>';
                    data.forEach(airport => {
                        html += `
                            <div class="result-item">
                                <h3>${airport.name} (${airport.iata})</h3>
                                <p>${airport.city}, ${airport.country}</p>
                            </div>
                        `;
                    });
                    resultsContainer.innerHTML = html;
                } else {
                    resultsContainer.innerHTML = '<p>No matching destinations found. Try being more descriptive!</p>';
                }

            } catch (error) {
                loader.style.display = 'none';
                console.error('Search failed:', error);
                resultsContainer.innerHTML = '<p class="error">An error occurred while searching. Please try again.</p>';
            }
        }

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
